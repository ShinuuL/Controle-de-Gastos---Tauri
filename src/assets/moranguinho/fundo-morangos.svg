    <circle cx="114.7" cy="117.4" r="4"/>
    <circle cx="159.7" cy="94.0" r="4"/>
    <circle cx="133.0" cy="66.9" r="4"/>
    <circle cx="74.4" cy="201.0" r="4"/>
    <circle cx="73.3" cy="12.9" r="4"/>
    <circle cx="44.2" cy="82.4" r="4"/>
    <circle cx="-4.4" cy="198.5" r="4"/>
    <circle cx="219.6" cy="198.5" r="4"/>
    <circle cx="198.9" cy="149.9" r="4"/>
    <circle cx="216.5" cy="81.1" r="4"/>
    <circle cx="176.9" cy="73.6" r="4"/>
    <circle cx="159.1" cy="4.2" r="4"/>
    <circle cx="159.1" cy="228.2" r="4"/>
    <circle cx="200.8" cy="57.7" r="4"/>
    <circle cx="167.1" cy="163.7" r="4"/>
    <circle cx="187.6" cy="216.7" r="4"/>
    <circle cx="44.6" cy="49.9" r="4"/>
    <circle cx="57.9" cy="109.1" r="4"/>
    <circle cx="139.1" cy="139.4" r="4"/>
    <circle cx="193.4" cy="25.7" r="4"/>
  </g>
</svg>
